[project]
name = "cellresponse"
version = "0.1.0"
description = "Context-conditioned perturbation search over single-cell response distributions (Tahoe-100M)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "equinox>=0.11",
    "flowjax>=17",
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "jax>=0.4.35",
    "numpy>=2.0",
    "optax>=0.2.4",
    "polars>=1.10",
    "pyarrow>=17",
    "pyyaml>=6",
    "rdkit>=2024.3",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.scripts]
cellresponse = "cellresponse.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellresponse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires network access to Hugging Face"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
