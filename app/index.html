  select.append(option);
});
function draw() {
  const query = DATA.queries[Number(select.value)];
  title.textContent = `${query.line_name} on plate ${query.plate}`;
  panel.replaceChildren();
  query.ranking.forEach((item) => {
    const row = document.createElement("li");
    const name = item.compound_key === null ? "Do nothing" : item.compound_key;

    panel.append(row);
  });
  measured.hidden = true;
  measured.textContent = "";
}
select.addEventListener("change", draw);
document.querySelector("#reveal").addEventListener("click", () => {
  const query = DATA.queries[Number(select.value)];
  const choice = query.picked_nothing ? "doing nothing" : "the top pick";
  measured.hidden = false;
  measured.textContent = `Measured utility of ${choice}: ${query.measured_top1.toFixed(3)}. This was opened after the ranking was hashed.`;
